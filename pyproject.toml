[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agency-swarm-datacircle"
version = "0.1.0"
description = "Agency Swarm tools for the Datacircle API: find the best GTM APIs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["agency-swarm>=1.0.0"]
keywords = ["agency-swarm", "agents", "tools", "basetool", "gtm", "api", "api-pricing", "b2b-data", "datacircle"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://datacircle.dev"
Documentation = "https://api.datacircle.dev/v1/openapi.json"
Repository = "https://github.com/waynehamadi/agency-swarm-datacircle"

[dependency-groups]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/agency_swarm_datacircle"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]
